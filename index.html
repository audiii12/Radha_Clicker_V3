<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Radha-Clicker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,'Times New Roman',serif;color:#fff8e6;background:#2a6b4a;overflow:hidden;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;z-index:0}
#bg svg{width:100%;height:100%}
#app{position:relative;z-index:1;display:grid;grid-template-columns:1fr 330px;height:100%}
.panel{display:flex;flex-direction:column;align-items:center;min-height:0}
#left{justify-content:flex-start;padding:10px;position:relative;overflow:hidden}
#title{font-size:clamp(26px,4vw,40px);margin:4px 0 0;text-shadow:0 2px 6px #000a;letter-spacing:1px;color:#ffe27a}
#nameWrap{background:#0007;border-radius:10px;padding:6px 14px;margin-top:6px;text-align:center;cursor:pointer;font-size:18px}
#nameWrap input{font:inherit;background:#fff;color:#222;border:0;border-radius:6px;padding:3px 8px;width:170px}
#nameWrap small{display:block;font-size:11px;opacity:.7}
#count{font-size:clamp(24px,4vw,36px);margin-top:10px;background:#0008;padding:6px 18px;border-radius:12px;text-align:center}
#cps{font-size:14px;opacity:.9}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#big{width:min(62vw,300px,42vh);aspect-ratio:1;cursor:pointer;border-radius:50%;transition:transform .08s;filter:drop-shadow(0 8px 14px #0008);-webkit-tap-highlight-color:transparent}
#big:active,#big.pop{transform:scale(.93)}
#big:hover{filter:drop-shadow(0 8px 18px #ffd34fcc)}
#clicks{font-size:14px;background:#0008;padding:4px 14px;border-radius:20px;margin-bottom:8px}
#fall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fp{position:absolute;top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.plus{position:absolute;pointer-events:none;font-weight:bold;font-size:22px;color:#fff;text-shadow:0 2px 4px #000;animation:up 1s forwards;z-index:5}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#right{background:#2b1408e6;border-left:3px solid #ffd34f;overflow-y:auto;padding:8px}
#right h3{margin:6px 0;text-align:center;color:#ffe27a;font-size:18px;border-bottom:1px solid #ffd34f66;padding-bottom:4px}
#ups{display:flex;gap:6px;flex-wrap:wrap;min-height:10px}
.up{background:#5a2d0f;border:2px solid #ffd34f;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer;flex:1 1 90px;text-align:center}
.up.no,.item.no{opacity:.5;cursor:not-allowed}
.up:not(.no):hover,.item:not(.no):hover{background:#7a3d12}
.item{display:flex;align-items:center;gap:8px;background:#4a2410;border:2px solid #c98a2b;border-radius:10px;padding:8px;margin:6px 0;cursor:pointer}
.item.locked{background:#222;border-color:#555;cursor:default;opacity:.7}
.item .ic{font-size:28px;width:38px;text-align:center}
.item .tx{flex:1;font-size:14px;line-height:1.25}
.item .tx b{font-size:15px;color:#ffe27a}
.item .cost{font-size:13px;color:#9dff9d}
.item.no .cost{color:#ff9d9d}
.item .n{font-size:26px;font-weight:bold;opacity:.7;min-width:30px;text-align:right}
.bar{height:5px;background:#0006;border-radius:3px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd34f}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#ffd34f;color:#3a1b00;padding:8px 18px;border-radius:20px;z-index:20;font-weight:bold;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
@media(max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:56% 44%}
 #right{border-left:0;border-top:3px solid #ffd34f}
 #big{width:min(40vw,200px,28vh)}
 #title{font-size:24px}
}
html{touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#big,#left{touch-action:none}
#choose{position:fixed;inset:0;z-index:100;background:linear-gradient(#f6a04d,#2a6b4a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#choose h1{margin:0;color:#fff3b0;text-shadow:0 2px 6px #0008;font-size:clamp(30px,8vw,48px)}
#choose p{margin:0 0 6px;font-size:18px}
#choose button{font:inherit;font-size:22px;width:min(300px,80vw);padding:16px;border-radius:14px;border:3px solid #ffd34f;background:#5a2d0f;color:#fff8e6;cursor:pointer;touch-action:manipulation}
#choose button:hover,#choose button:active{background:#7a3d12}
.sbtn{display:none;font:inherit;font-size:18px;padding:12px 22px;border-radius:14px;border:3px solid #ffd34f;background:#5a2d0f;color:#fff8e6;touch-action:manipulation;margin-top:6px;cursor:pointer}
body.phone .sbtn{display:block}
#closeStore{position:sticky;top:0;width:100%;margin:0 0 8px;z-index:2}
body.phone #app{grid-template-columns:1fr;grid-template-rows:100%}
body.phone #left{padding:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body.phone #right{position:fixed;inset:0;z-index:50;border:0;display:none;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));-webkit-overflow-scrolling:touch}
body.phone.store #right{display:block}
body.phone #nameWrap{font-size:15px;padding:4px 10px}
body.phone #count{font-size:24px;padding:4px 14px;margin-top:8px}
body.phone #clicks{margin-bottom:4px}
body.phone #big{width:min(72vw,320px,40vh)}
body.phone #title{font-size:24px}
body.phone .item{padding:10px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const ITEMS=[
 {id:'step',n:'One Step Of Vrindavan Parikrama',ic:'👣',at:108,base:100,r:0.2},
 {id:'mandir',n:'Mandir',ic:'🛕',at:1188,base:1100,r:8},
 {id:'vart',n:'Ekantik Vartalap with Premanand Maharaj ji',ic:'🙏',at:10800,base:12000,r:47},
 {id:'seva',n:'Day of Seva for Shri Radhavallabh Lal Ji',ic:'🪔',at:108000,base:130000,r:260}
];
const UPS=[
 {id:'mala',n:'Tulsi Mala',d:'Clicks x2',cost:300,t:'click'},
 {id:'bans',n:'Krishna\'s Bansuri',d:'Clicks x2',cost:4000,t:'click'},
 {id:'govd',n:'Govardhan Blessing',d:'Production x2',cost:10000,t:'prod'},
 {id:'naam',n:'Maha-mantra Kirtan',d:'Production x2',cost:120000,t:'prod'}
];
let S;
function fresh(){return{prem:0,clicks:0,name:'Aryan',own:{},ups:[]}}
try{S=JSON.parse(localStorage.getItem('radhaClicker'))||fresh()}catch(e){S=fresh()}
S.own=S.own||{};S.ups=S.ups||[];
const fmt=n=>n<1e4?(n<100&&n%1?n.toFixed(1):Math.floor(n).toLocaleString()):n<1e6?Math.floor(n).toLocaleString():n<1e9?(n/1e6).toFixed(2)+' M':(n/1e9).toFixed(2)+' B';
const cost=it=>it.base;
const clickPow=()=>Math.pow(2,S.ups.filter(u=>UPS.find(x=>x.id==u).t=='click').length);
const prodMul=()=>Math.pow(2,S.ups.filter(u=>UPS.find(x=>x.id==u).t=='prod').length);
const cps=()=>ITEMS.reduce((a,i)=>a+(S.own[i.id]||0)*i.r,0)*prodMul();

/* sounds */
let AC;
function ctx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function chime(f){const a=ctx();if(!a)return;const t=a.currentTime;
 [f,f*2.01,f*3].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=fr;
  g.gain.setValueAtTime(.18/(i+1),t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.55)})}
const notes=[523,587,659,784,880];let ni=0;
function clickSound(){chime(notes[ni++%notes.length])}
function radhaSound(){
 chime(392);
 try{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Radha');u.rate=.7;u.pitch=1.1;u.volume=1;speechSynthesis.speak(u)}}catch(e){}
}

/* falling feathers & flowers */
const feather=()=>`<svg width="34" height="46" viewBox="0 0 34 46"><path d="M17 44 V16" stroke="#1d6b4a" stroke-width="1.5"/><path d="M17 4 C2 12 2 30 17 36 C32 30 32 12 17 4Z" fill="#17a673"/><path d="M17 8 C8 14 8 26 17 31 C26 26 26 14 17 8Z" fill="#1c6fd1"/><ellipse cx="17" cy="19" rx="5" ry="7" fill="#0d3b8c"/><ellipse cx="17" cy="19" rx="2.5" ry="4" fill="#ffd21f"/></svg>`;
const flower=c=>`<svg width="30" height="30" viewBox="0 0 30 30"><g fill="${c}" stroke="#0003" stroke-width=".6">${[0,72,144,216,288].map(r=>`<ellipse cx="15" cy="7.5" rx="5" ry="7" transform="rotate(${r} 15 15)"/>`).join('')}</g><circle cx="15" cy="15" r="3.5" fill="${c=='#ffd21f'?'#d97a00':'#fff3a0'}"/></svg>`;
function drop(){
 const L=$('fall'),w=L.clientWidth;const k=Math.random();
 const d=document.createElement('div');d.className='fp';
 d.innerHTML=k<.4?feather():flower(k<.7?'#ffd21f':'#2f6fff');
 d.style.left=Math.random()*(w-40)+'px';
 d.style.animationDuration=(1.6+Math.random()*1.4)+'s';
 d.style.setProperty('--r',(Math.random()*540-270)+'deg');
 L.appendChild(d);setTimeout(()=>d.remove(),3200);
}
function plus(e,v){const p=document.createElement('div');p.className='plus';p.textContent='+'+fmt(v);
 const r=$('left').getBoundingClientRect();p.style.left=(e.clientX-r.left-10)+'px';p.style.top=(e.clientY-r.top-30)+'px';$('left').appendChild(p);setTimeout(()=>p.remove(),1000)}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2600)}

/* click */
let radhaCount=0,radhaNext=3;
$('big').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(++radhaCount>=radhaNext){radhaSound();radhaCount=0}else clickSound();
 const v=clickPow();S.prem+=v;S.clicks++;
 const b=$('big');b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),80);
 plus(e,v);for(let i=0;i<3;i++)setTimeout(drop,i*60);
 ITEMS.forEach(it=>{if(S.clicks==it.at){toast('Unlocked: '+it.n+'!');radhaSound()}});
 if(S.clicks%108==0&&!ITEMS.some(it=>it.at==S.clicks))toast('108 clicks! Jai Shri Radhe 🌼');
 update();
});

/* store */
const store=$('store');
ITEMS.forEach(it=>{
 const d=document.createElement('div');d.className='item locked';d.id='it_'+it.id;
 d.innerHTML=`<div class="ic">${it.ic}</div><div class="tx"><b>${it.n}</b><div class="cost"></div><div class="bar"><i></i></div></div><div class="n"></div>`;
 d.onclick=()=>{
  if(S.clicks<it.at)return;const c=cost(it);
  if(S.prem>=c){S.prem-=c;S.own[it.id]=(S.own[it.id]||0)+1;radhaSound();save();update()}
 };
 store.appendChild(d);
});
function buildUps(){
 const U=$('ups');U.innerHTML='';
 UPS.filter(u=>!S.ups.includes(u.id)).slice(0,4).forEach(u=>{
  const d=document.createElement('div');d.className='up';d.dataset.id=u.id;
  d.innerHTML=`<b>${u.n}</b><br>${u.d}<br><span>${fmt(u.cost)} Prem</span>`;
  d.onclick=()=>{if(S.prem>=u.cost){S.prem-=u.cost;S.ups.push(u.id);radhaSound();buildUps();save();update()}};
  U.appendChild(d)});
}
function update(){
 $('prem').textContent=fmt(S.prem);$('clk').textContent=S.clicks.toLocaleString();
 $('cps').textContent='per second: '+fmt(cps()*1)+(cps()<10?'':'');
 ITEMS.forEach(it=>{
  const d=$('it_'+it.id),open=S.clicks>=it.at,c=cost(it);
  d.classList.toggle('locked',!open);d.classList.toggle('no',open&&S.prem<c);
  d.querySelector('.cost').textContent=open?fmt(c)+' Prem  (+'+Number((it.r*prodMul()).toFixed(1))+'/s each)':'Unlocks at '+it.at.toLocaleString()+' clicks';
  d.querySelector('.bar').style.display=open?'none':'block';
  d.querySelector('.bar i').style.width=Math.min(100,S.clicks/it.at*100)+'%';
  d.querySelector('.n').textContent=open?(S.own[it.id]||0):'🔒';
 });
 document.querySelectorAll('.up').forEach(e=>{const u=UPS.find(x=>x.id==e.dataset.id);e.classList.toggle('no',S.prem<u.cost)});
}

/* name */
function showName(){$('nameWrap').innerHTML=`<span id="nameTxt">${S.name.replace(/[<>&]/g,'')}'s Kunj</span><small>(click to change name)</small>`;
 document.title=S.name.replace(/[<>&]/g,'')+"'s Kunj – Radha-Clicker"}
$('nameWrap').addEventListener('click',function h(){
 if(this.querySelector('input'))return;
 this.innerHTML='<input maxlength="20" placeholder="Your name">';
 const i=this.querySelector('input');i.value=S.name;i.focus();i.select();
 const done=()=>{S.name=(i.value.trim()||'Aryan');save();showName()};
 i.addEventListener('keydown',e=>{if(e.key=='Enter')done()});i.addEventListener('blur',done);
});

function save(){try{localStorage.setItem('radhaClicker',JSON.stringify(S))}catch(e){}}
$('reset').onclick=()=>{if($('reset').dataset.s){S=fresh();save();buildUps();showName();update();$('reset').textContent='Reset game';delete $('reset').dataset.s}else{$('reset').textContent='Click again to confirm reset';$('reset').dataset.s=1;setTimeout(()=>{$('reset').textContent='Reset game';delete $('reset').dataset.s},3000)}};

/* passive production */
let last=Date.now(),sv=0;
setInterval(()=>{
 const n=Date.now(),dt=(n-last)/1000;last=n;const c=cps();
 if(c>0){S.prem+=c*dt;if(Math.random()<Math.min(.5,c/40))drop()}
 update();if(++sv%20==0)save();
},100);

/* scattered ground flowers in the background */
(function(){let h='';for(let i=0;i<60;i++){const x=Math.random()*800,y=372+Math.random()*125,c=Math.random()<.5?'#ffd21f':'#2f6fff';h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(2+Math.random()*2.5).toFixed(1)}" fill="${c}"/>`}
 $('fl').innerHTML=h})();

function pick(m){document.body.classList.add(m);$('choose').style.display='none';ctx();
 if(m=='phone'){
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('gesturechange',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>e.preventDefault());
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
  let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&!e.target.closest('#right,.sbtn'))e.preventDefault();lt=n},{passive:false});
 }
}
$('openStore').onclick=()=>{document.body.classList.add('store');$('right').scrollTop=0};
$('closeStore').onclick=()=>document.body.classList.remove('store');
setInterval(()=>{const ok=ITEMS.some(it=>S.clicks>=it.at&&S.prem>=cost(it))||UPS.some(u=>!S.ups.includes(u.id)&&S.prem>=u.cost);$('openStore').textContent='🛒 Store & Upgrades'+(ok?' ●':'')},500);
$('pPhone').onclick=()=>pick('phone');$('pDesk').onclick=()=>pick('desktop');
showName();buildUps();update();
</script>
</body></html>
